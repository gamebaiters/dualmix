name: Bug report
description: Report a bug or unexpected behavior in DualMix
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: DualMix version
      description: Shown in General → About (e.g. 2.3.0)
      placeholder: "2.3.0"
    validations:
      required: true
  - type: input
    id: audio
    attributes:
      label: Audio device / Mixing mode
      description: E.g. USB DAC / Realtek / Bluetooth, Per-App Volume or Virtual Devices (VB-CABLE)
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics (optional)
      description: Paste relevant lines from `%APPDATA%\DualMix\dualmix.log` or `diag.txt` (`General → Diagnostics`).
      render: text
