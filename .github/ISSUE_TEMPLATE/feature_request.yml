name: Feature request
description: Suggest an improvement or new feature for DualMix
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or improve?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Use case
      description: How would you use it in practice?
