# Auto-builder (CI): runs on push to main / master / rust-rewrite and on pull requests.
# Builds the native Rust binary (`dualmix-rs`), runs workspace tests, verifies PowerShell scripts,
# packages DualMix (zip + NSIS installer + version.json), and uploads artifacts.
name: build

on:
  push:
    branches: [main, master, rust-rewrite]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dualmix-rs

      - name: Check PowerShell scripts syntax
        shell: pwsh
        run: |
          $files = @(Get-ChildItem packaging/setup/*.ps1; Get-Item install.ps1)
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($f.Name): $($_.Message)" }
              exit 1
            }
            Write-Host "OK: $($f.Name)"
          }

      - name: Run unit tests & build native release binary
        shell: pwsh
        run: |
          cargo test --manifest-path dualmix-rs/Cargo.toml --workspace
          cargo build --manifest-path dualmix-rs/Cargo.toml --release
          ./dualmix-rs/target/release/DualMix.exe --version

      - name: Build package and NSIS installer
        shell: bash
        run: |
          tools/build-release.sh --exe dualmix-rs/target/release/DualMix.exe --notes "CI build (${GITHUB_SHA::7})"
          (cd out/release && sha256sum -c SHA256SUMS.txt)
          python3 -c "import json; d = json.load(open('out/release/version.json')); assert d['product'] == 'DualMix' and len(d['sha256']) == 64"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DualMix-win-x64-ci
          path: |
            out/release/*
            packaging/README.txt
            packaging/LEGGIMI.txt
          retention-days: 14
