# Publishes a DualMix release when a tag "v<version>" is pushed (the tag must match <Version> in DualMix.csproj):
#   1. builds the package, the installer, the cleanup zip and version.json (tools/build-release.sh);
#   2. creates the GitHub release with those files (including LEGGIMI.txt);
#   3. commits version.json to the default branch: that is the file every running DualMix reads
#      (https://raw.githubusercontent.com/<owner>/<repo>/main/version.json) to find out there is a new version.
# Manual trigger (workflow_dispatch) builds a downloadable snapshot artifact without publishing a release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for snapshot build (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install NSIS and zip
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis zip

      - name: Resolve version
        run: |
          version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' DualMix/DualMix.csproj | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match the project version $version" >&2
              exit 1
            fi
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the release
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            notes="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
            tools/build-release.sh \
              --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
              --notes "$notes"
          else
            notes="${{ github.event.inputs.notes }}"
            tools/build-release.sh --notes "${notes:-Snapshot (${GITHUB_SHA::7})}"
          fi
          (cd out/release && sha256sum -c SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualMix-${{ env.VERSION }}
          path: |
            out/release/*
            packaging/LEGGIMI.txt
          retention-days: 30

      - name: Create the GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/LEGGIMI.txt out/release/LEGGIMI.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/release/* \
              --title "DualMix $VERSION" --generate-notes
          fi

      - name: Announce the version to the installed copies (version.json on the default branch)
        if: env.IS_RELEASE == 'true'
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          cp out/release/version.json version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "version.json: DualMix $VERSION" || exit 0
          git push origin "$branch"
