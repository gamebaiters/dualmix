# Publishes a DualMix release when a tag "v<version>" is pushed (matching version in dualmix-rs/Cargo.toml):
#   1. builds the native Rust binary, zip package, NSIS installer, cleanup zip, and version.json;
#   2. creates the GitHub release with those files (including LEGGIMI.txt);
#   3. commits version.json to the default branch.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes for snapshot build (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dualmix-rs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' dualmix-rs/Cargo.toml | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "Tag $GITHUB_REF_NAME does not match dualmix-rs/Cargo.toml version $version" >&2
              exit 1
            fi
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test & build native release binary
        shell: pwsh
        run: |
          cargo test --manifest-path dualmix-rs/Cargo.toml --workspace
          cargo build --manifest-path dualmix-rs/Cargo.toml --release

      - name: Package release
        shell: bash
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            notes="$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")"
            tools/build-release.sh \
              --exe dualmix-rs/target/release/DualMix.exe \
              --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" \
              --notes "$notes"
          else
            notes="${{ github.event.inputs.notes }}"
            tools/build-release.sh \
              --exe dualmix-rs/target/release/DualMix.exe \
              --notes "${notes:-Snapshot (${GITHUB_SHA::7})}"
          fi
          (cd out/release && sha256sum -c SHA256SUMS.txt)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualMix-${{ env.VERSION }}
          path: |
            out/release/*
            packaging/README.txt
            packaging/LEGGIMI.txt
          retention-days: 30

      - name: Create the GitHub release
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/README.txt out/release/README.txt
          cp packaging/LEGGIMI.txt out/release/LEGGIMI.txt
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/release/* \
              --title "DualMix $VERSION" --generate-notes
          fi

      - name: Announce the version to the installed copies (version.json on the default branch)
        if: env.IS_RELEASE == 'true'
        shell: bash
        run: |
          branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          cp out/release/version.json version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet version.json; then
            git add version.json
            git commit -m "chore: publish version.json $VERSION"
            git push origin "$branch"
          fi
