<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141923"/>
      <stop offset="100%" stop-color="#0f131c"/>
    </linearGradient>
    <linearGradient id="osdMixTrack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff7838"/>
      <stop offset="50%" stop-color="#8a8a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#40beff"/>
    </linearGradient>
    <filter id="osdShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="958" height="258" rx="16" fill="url(#panelBg)" stroke="#273043" stroke-width="1.5"/>
  <text x="32" y="40" fill="#f8fafc" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Indicatore a schermo (OSD) in stile Windows 11</text>
  <text x="32" y="63" fill="#94a3b8" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5">Non ruba il focus (WS_EX_NOACTIVATE), ignora i clic (WS_EX_TRANSPARENT) e si nasconde davvero al termine della dissolvenza</text>

  <!-- Left OSD card: Mix -->
  <g filter="url(#osdShadow)">
    <rect x="52" y="94" width="380" height="92" rx="10" fill="#2c2c2c" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <!-- sliders icon -->
  <line x1="80" y1="128" x2="104" y2="128" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="88" cy="128" r="3" fill="#ffffff"/>
  <line x1="80" y1="140" x2="104" y2="140" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="98" cy="140" r="3" fill="#ffffff"/>
  <line x1="80" y1="152" x2="104" y2="152" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="91" cy="152" r="3" fill="#ffffff"/>

  <text x="122" y="128" fill="#ffffff" fill-opacity="0.78" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13">Mix Game/Chat</text>
  <text x="408" y="129" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">70% Game</text>
  <rect x="122" y="148" width="286" height="5" rx="2.5" fill="url(#osdMixTrack)"/>
  <rect x="264" y="143" width="2" height="15" rx="1" fill="#ffffff" fill-opacity="0.65"/>
  <circle cx="212" cy="150.5" r="7" fill="#ffffff" stroke="#2c2c2c" stroke-width="2"/>
  <text x="242" y="220" fill="#94a3b8" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Barra bipolare per il bilanciamento Game / Chat</text>

  <!-- Right OSD card: Volume -->
  <g filter="url(#osdShadow)">
    <rect x="526" y="94" width="380" height="92" rx="10" fill="#2c2c2c" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <!-- speaker icon -->
  <path d="M 556 134 L 563 134 L 571 127 L 571 153 L 563 146 L 556 146 Z" fill="#ffffff"/>
  <path d="M 576 133 Q 582 140 576 147" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 580 128 Q 589 140 580 152" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <text x="602" y="128" fill="#ffffff" fill-opacity="0.78" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13">Volume generale</text>
  <text x="882" y="129" fill="#ffffff" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="end">72%</text>
  <rect x="602" y="148" width="280" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="602" y="148" width="201" height="5" rx="2.5" fill="#60cdff"/>
  <text x="716" y="220" fill="#94a3b8" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle">Barra lineare per Volume generale, Game e Chat</text>

</svg>
