<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DualMix</title>
<style>
:root {
  color-scheme: dark;
  --bg: #202020;
  --shell-bg: rgba(32, 32, 32, 0.56);
  --frame-bg: rgba(40, 40, 40, 0.44);
  --frame-border: rgba(255, 255, 255, 0.065);
  --surface: rgba(255, 255, 255, 0.052);
  --surface-hover: rgba(255, 255, 255, 0.085);
  --surface-border: rgba(255, 255, 255, 0.08);
  --control-bg: rgba(255, 255, 255, 0.06);
  --control-border: rgba(255, 255, 255, 0.11);
  --subtle-bg: rgba(255, 255, 255, 0.065);
  --nav-active: rgba(255, 255, 255, 0.075);
  --text: #FFFFFF;
  --text2: rgba(255, 255, 255, 0.72);
  --text3: rgba(255, 255, 255, 0.48);
  --accent: #60CDFF;
  --accent-text: #000000;
  --accent-link: #60CDFF;
  --game: #FF9A52;
  --game-soft: rgba(255, 154, 82, 0.18);
  --chat: #5CC8FF;
  --chat-soft: rgba(92, 200, 255, 0.18);
  --meter-track: rgba(255, 255, 255, 0.13);
  --success: #6CCB5F;
  --success-bg: rgba(108, 203, 95, 0.13);
  --warn: #FCE100;
  --warn-bg: rgba(252, 225, 0, 0.12);
  --err: #FF99A4;
  --err-bg: rgba(255, 153, 164, 0.13);
  --info: #60CDFF;
  --info-bg: rgba(96, 205, 255, 0.12);
  --thumb-outer: #3B3B3B;
  --thumb-border: rgba(255, 255, 255, 0.16);
  --dropdown-bg: #2C2C2C;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #F3F3F3;
  --shell-bg: rgba(243, 243, 243, 0.56);
  --frame-bg: rgba(255, 255, 255, 0.48);
  --frame-border: rgba(0, 0, 0, 0.06);
  --surface: rgba(255, 255, 255, 0.78);
  --surface-hover: rgba(255, 255, 255, 0.96);
  --surface-border: rgba(0, 0, 0, 0.068);
  --control-bg: rgba(255, 255, 255, 0.76);
  --control-border: rgba(0, 0, 0, 0.095);
  --subtle-bg: rgba(0, 0, 0, 0.045);
  --nav-active: rgba(0, 0, 0, 0.05);
  --text: #1A1A1A;
  --text2: rgba(0, 0, 0, 0.62);
  --text3: rgba(0, 0, 0, 0.44);
  --accent: #005FB8;
  --accent-text: #FFFFFF;
  --accent-link: #005FB8;
  --game: #C24E00;
  --game-soft: rgba(194, 78, 0, 0.14);
  --chat: #0067C0;
  --chat-soft: rgba(0, 103, 192, 0.14);
  --meter-track: rgba(0, 0, 0, 0.13);
  --success: #0F7B0F;
  --success-bg: rgba(15, 123, 15, 0.10);
  --warn: #9D5D00;
  --warn-bg: rgba(255, 244, 206, 0.85);
  --err: #C42B1C;
  --err-bg: rgba(253, 231, 233, 0.86);
  --info: #005FB8;
  --info-bg: rgba(0, 95, 184, 0.09);
  --thumb-outer: #FFFFFF;
  --thumb-border: rgba(0, 0, 0, 0.18);
  --dropdown-bg: #FFFFFF;
}
html.snapshot-opaque {
  --shell-bg: var(--bg);
}
html.snapshot-opaque[data-theme="light"] {
  --frame-bg: #F9F9F9;
}
html.snapshot-opaque[data-theme="dark"] {
  --frame-bg: #272727;
}
* { box-sizing: border-box; user-select: none; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--shell-bg); color: var(--text);
  font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; line-height: 1.4; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px; }
svg { display: block; flex-shrink: 0; }
.hidden { display: none !important; }

/* Integrated Fluent 2 TitleBar */
.titlebar {
  height: 36px; width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding-left: 14px; flex-shrink: 0; -webkit-app-region: drag;
}
.tb-left { display: flex; align-items: center; gap: 10px; pointer-events: none; }
.tb-title { font-size: 12px; font-weight: 400; color: var(--text); letter-spacing: 0.01em; }
.tb-actions { display: flex; height: 34px; align-items: stretch; -webkit-app-region: no-drag; }
.tb-btn {
  width: 46px; height: 34px; border: none; background: transparent; color: var(--text);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background 0.1s, color 0.1s; padding: 0;
}
.tb-btn:hover { background: var(--subtle-bg); }
.tb-close:hover { background: #C42B1C; color: #FFFFFF; }

/* Main shell + NavigationView */
.root-col { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
.app-shell { display: flex; flex: 1; min-height: 0; width: 100%; }
.nav {
  width: 218px; flex-shrink: 0; padding: 2px 6px 10px 6px;
  display: flex; flex-direction: column; justify-content: space-between;
  background: transparent; transition: width 0.14s ease;
}
.nav.collapsed { width: 52px; }
.nav-top { display: flex; flex-direction: column; gap: 2px; }
.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-ham {
  width: 40px; height: 34px; border-radius: 5px; border: none; background: transparent;
  color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px; transition: background 0.12s;
}
.nav-ham:hover { background: var(--subtle-bg); }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 36px;
  padding: 0 11px; border-radius: 5px; border: none;
  background: transparent; color: var(--text); cursor: pointer;
  font-size: 13.5px; text-align: left; position: relative; white-space: nowrap; overflow: hidden;
  font-family: inherit; transition: background 0.12s;
}
.nav-item:hover { background: var(--subtle-bg); }
.nav-item.active { background: var(--nav-active); font-weight: 500; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 9px; bottom: 9px;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.nav.collapsed .nav-item { padding: 0; justify-content: center; }
.nav.collapsed .nav-label { display: none; }
.nav-sep { height: 1px; background: var(--surface-border); margin: 4px 6px 6px 6px; }

.content-frame {
  flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--frame-bg);
  border-top: 1px solid var(--frame-border);
  border-left: 1px solid var(--frame-border);
  border-top-left-radius: 8px;
}
.content-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 14px 34px 18px 34px;
}
.page { max-width: 980px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 10px; }
.page-title { font-size: 28px; font-weight: 600; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
.page-sub { font-size: 13.5px; color: var(--text2); margin: 3px 0 0 0; }
.section-header { font-size: 14px; font-weight: 600; margin: 12px 0 6px 0; color: var(--text); }

/* Cards & surfaces */
.card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 8px; padding: 12px 18px; margin-bottom: 4px;
}
.card-hero { padding: 14px 20px; }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.card-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
.card-title { font-size: 14px; font-weight: 500; color: var(--text); }
.card-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

/* Chip & badge */
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 14px;
  background: var(--control-bg); border: 1px solid var(--control-border);
  font-size: 12px; color: var(--text2); white-space: nowrap; margin-top: 2px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-success { background: var(--success); }
.dot-warning { background: var(--warn); }
.dot-error { background: var(--err); }
.dot-info { background: var(--info); }

.badge {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.badge-sm { width: 32px; height: 32px; }
.badge-game { background: var(--game-soft); color: var(--game); }
.badge-chat { background: var(--chat-soft); color: var(--chat); }
.badge-neutral { background: var(--subtle-bg); color: var(--text); }

/* Status banner */
.banner {
  border-radius: 8px; padding: 11px 15px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--surface-border);
}
.banner-success { background: var(--success-bg); }
.banner-warning { background: var(--warn-bg); }
.banner-error { background: var(--err-bg); }
.banner-info { background: var(--info-bg); }
.banner-icon-success { color: var(--success); }
.banner-icon-warning { color: var(--warn); }
.banner-icon-error { color: var(--err); }
.banner-icon-info { color: var(--info); }

/* Buttons & inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 31px; padding: 0 13px; border-radius: 5px;
  border: 1px solid var(--control-border); border-bottom-color: rgba(0, 0, 0, 0.16);
  background: var(--control-bg); color: var(--text); font-family: inherit;
  font-size: 13px; font-weight: 400; cursor: pointer; transition: background 0.1s; white-space: nowrap;
}
html:not([data-theme="light"]) .btn { border-bottom-color: rgba(255, 255, 255, 0.14); }
.btn:hover:not(:disabled) { background: var(--surface-hover); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn-subtle { background: transparent; border-color: transparent; }
.btn-subtle:hover:not(:disabled) { background: var(--subtle-bg); }
.btn-icon { width: 34px; height: 34px; padding: 0; }
.btn-icon.muted { color: var(--err); }

select.fluent-select, input.fluent-input {
  height: 32px; padding: 0 10px; border-radius: 5px;
  border: 1px solid var(--control-border); background: var(--dropdown-bg);
  color: var(--text); font-family: inherit; font-size: 13px; outline: none;
}
select.fluent-select option { background: var(--dropdown-bg); color: var(--text); }
input.fluent-input { width: 100%; padding-left: 32px; }
input.fluent-input:focus, select.fluent-select:focus { border-color: var(--accent); }

/* Toggle switch */
.switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch-track {
  width: 40px; height: 20px; border-radius: 10px;
  background: transparent; border: 1.5px solid var(--text2);
  position: relative; transition: all 0.15s;
}
.switch-track::after {
  content: ''; position: absolute; left: 3px; top: 2.5px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--text2); transition: all 0.15s;
}
.switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .switch-track::after { transform: translateX(19px); background: var(--accent-text); }
.switch input:disabled + .switch-track { opacity: 0.4; cursor: default; }

/* Segmented control */
.segment {
  display: inline-flex; align-items: center; padding: 2px; border-radius: 6px;
  background: var(--control-bg); border: 1px solid var(--control-border);
}
.seg-btn {
  min-width: 64px; height: 28px; padding: 0 12px; border-radius: 4px;
  border: none; background: transparent; color: var(--text);
  font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.seg-btn:hover { background: var(--subtle-bg); }
.seg-btn.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }

/* Fluent 2 Sliders with accent progress fill + concentric WPF-UI thumb */
.slider-wrap { display: flex; align-items: center; gap: 10px; width: 100%; }
input[type="range"].fluent-range {
  -webkit-appearance: none; appearance: none; width: 100%; height: 24px;
  background: transparent; cursor: pointer; margin: 0; outline: none;
}
input[type="range"].fluent-range::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(
    to right,
    var(--accent) 0%,
    var(--accent) var(--pct, 50%),
    var(--meter-track) var(--pct, 50%),
    var(--meter-track) 100%
  );
}
input[type="range"].fluent-range:disabled::-webkit-slider-runnable-track {
  background: var(--meter-track);
}
input[type="range"].fluent-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%; margin-top: -7px;
  background: var(--accent); border: 1px solid var(--thumb-border);
  box-shadow: inset 0 0 0 4px var(--thumb-outer), 0 1px 3px rgba(0, 0, 0, 0.22);
  transition: box-shadow 0.1s;
}
input[type="range"].fluent-range:hover:not(:disabled)::-webkit-slider-thumb {
  box-shadow: inset 0 0 0 3px var(--thumb-outer), 0 1px 4px rgba(0, 0, 0, 0.28);
}

/* ChatMix Balance Slider (matches WPF-UI Theme.xaml BalanceThumb 22px + 6px track) */
.balance-box { position: relative; flex: 1; height: 32px; display: flex; align-items: center; margin: 0 14px; }
.balance-track {
  position: absolute; left: 10px; right: 10px; height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, #E88338 0%, rgba(138, 138, 138, 0.34) 50%, #3E9FFF 100%);
  pointer-events: none;
}
.balance-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 2px; height: 14px; border-radius: 1px; background: var(--text3); pointer-events: none; opacity: 0.7;
}
input[type="range"].balance-range { position: relative; z-index: 2; }
input[type="range"].balance-range::-webkit-slider-runnable-track { background: transparent !important; height: 6px; }
input[type="range"].balance-range::-webkit-slider-thumb {
  width: 22px; height: 22px; margin-top: -8px;
  background: var(--accent); border: 1px solid var(--thumb-border);
  box-shadow: inset 0 0 0 4.5px var(--thumb-outer), 0 1px 4px rgba(0, 0, 0, 0.28);
}
input[type="range"].balance-range:hover::-webkit-slider-thumb {
  box-shadow: inset 0 0 0 3.5px var(--thumb-outer), 0 2px 6px rgba(0, 0, 0, 0.32);
}

/* Peak meter */
.meter-track {
  height: 3.5px; border-radius: 2px; background: var(--meter-track); overflow: hidden; margin-top: 8px;
}
.meter-fill {
  height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0);
  transition: transform 0.04s linear;
}
.meter-game { background: var(--game); }
.meter-chat { background: var(--chat); }
.meter-accent { background: var(--accent); }

/* Expander */
.expander-head { cursor: pointer; }
.expander-body { margin-top: 12px; padding-left: 14px; border-top: 1px solid var(--surface-border); padding-top: 12px; }

/* Checkboxes */
.chk-row { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.chk-row input[type="checkbox"], .radio-card input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

/* Apps rows */
.apps-toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.search-wrap { position: relative; width: 320px; }
.search-icon { position: absolute; left: 10px; top: 8px; color: var(--text2); pointer-events: none; }
.app-row { display: grid; grid-template-columns: 32px 1fr auto auto 176px; align-items: center; gap: 12px; padding: 10px 16px; }
.app-row.inactive { opacity: 0.6; }
.app-avatar {
  width: 32px; height: 32px; border-radius: 6px; background: var(--subtle-bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text2);
}

/* Wizard */
.wiz-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
.wiz-body { flex: 1; overflow-y: auto; padding: 14px 32px 16px 32px; }
.wiz-footer {
  border-top: 1px solid var(--surface-border); padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.radio-card { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.knob-box {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin-top: 14px; font-size: 13px;
}
.link { color: var(--accent-link); text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; }
</style>
<style>
html, body { background: var(--bg); }
.icon { font-family: 'Segoe Fluent Icons', 'Segoe MDL2 Assets'; font-style: normal; font-weight: normal; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
.app-shell { height: 100vh; }
.nav { padding-top: 8px; }
.content-frame { border-top-left-radius: 8px; }
.knob-line { display: flex; align-items: center; gap: 12px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; margin: 12px 0 8px 0; font-size: 13px; }
.kv .k { color: var(--text2); }
.row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.vol-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.vol-row .pct { width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); font-size: 13px; }
.big-level { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cap { font-size: 12px; color: var(--text2); }
.mix-head { display: flex; justify-content: space-between; align-items: center; }
.mix-row { display: flex; align-items: center; margin-top: 10px; }
.mix-side { display: flex; align-items: center; gap: 12px; min-width: 140px; }
.mix-side.right { justify-content: flex-end; text-align: right; }
.mix-buttons { display: flex; justify-content: center; gap: 8px; margin-top: 10px; }
.app-row { grid-template-columns: 32px minmax(0,1fr) auto 210px; }
.app-name { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-sub { font-size: 12px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg-btn.small { min-width: 52px; height: 26px; font-size: 12.5px; padding: 0 8px; }
.empty { text-align: center; padding: 40px 20px; color: var(--text2); }
.infobar { border-radius: 8px; padding: 10px 14px; margin: 6px 0 10px 0; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--surface-border); }
.tech { white-space: pre-wrap; font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px; color: var(--text2); margin-top: 8px; }
.wiz-step { color: var(--text2); font-size: 12.5px; }
.wiz-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.radio-card.card { padding: 12px 14px; }
.btn-key { min-width: 160px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const LOC = __LOC_JSON__;
const ICON_URI = "__ICON_URI__";
const KIND = "__WINDOW_KIND__";
const IC = { mixer:'', apps:'', knob:'', audio:'', general:'', ham:'', game:'', chat:'',
  vol:'', mute:'', phones:'', download:'', repair:'', search:'', info:'', warning:'',
  error:'', success:'', reset:'', folder:'', add:'', down:'', up:'', cycle:'', test:'' };

let S = null;                 // last state from DualMix
const V = { page: 'mixer', nav: false, filter: '', inactive: false, exCycle: false, exKeys: false, exSignal: false, step: 1, wiz: null };
let interacting = false;      // a slider is being dragged / a list is open: renders wait
let pending = false;

function lang() { return S && S.lang === 'it' ? 1 : 0; }
function T(k, ...a) {
  const e = LOC[k]; let s = e ? e[lang()] : k;
  return s.replace(/\{(\d+)(:[^}]*)?\}/g, (m, i) => (a[+i] !== undefined ? a[+i] : ''));
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ic(n, size) { return `<span class="icon" style="font-size:${size||16}px">${IC[n]||''}</span>`; }
function send(obj) { try { window.chrome.webview.postMessage(JSON.stringify(obj)); } catch (e) {} }
function sw(checked, cmd, extra, disabled) {
  return `<label class="switch"><input type="checkbox" ${checked?'checked':''} ${disabled?'disabled':''} data-cmd='${esc(JSON.stringify(Object.assign({cmd}, extra||{})))}' onchange="onSwitch(this)"><span class="switch-track"></span></label>`;
}
function onSwitch(el) { const o = JSON.parse(el.dataset.cmd); o.value = el.checked; send(o); }
function seg(items, active, cmd, extra, small) {
  return `<div class="segment">${items.map(([v, label]) => `<button class="seg-btn ${small?'small':''} ${v===active?'active':''}" onclick='send(${esc(JSON.stringify(Object.assign({cmd, value:v}, extra||{})))})'>${esc(label)}</button>`).join('')}</div>`;
}
function range(id, value, min, max, cmd, extra, cls, step) {
  const pct = (value - min) * 100 / (max - min);
  return `<input type="range" class="fluent-range ${cls||''}" id="${id}" min="${min}" max="${max}" step="${step||1}" value="${value}" style="--pct:${pct}%" data-cmd='${esc(JSON.stringify(Object.assign({cmd}, extra||{})))}' oninput="onRange(this)">`;
}
function onRange(el) {
  const v = +el.value, min = +el.min, max = +el.max;
  el.style.setProperty('--pct', ((v - min) * 100 / (max - min)) + '%');
  const lbl = document.getElementById(el.id + '-lbl'); if (lbl) lbl.textContent = Math.round(v) + '%';
  if (el.id === 'mix') {
    const g = v <= 0 ? 100 : Math.round(100 - v);
    const c = v >= 0 ? 100 : Math.round(100 + v);
    const gl = document.getElementById('mix-game-lvl'); if (gl) gl.textContent = g + '%';
    const cl = document.getElementById('mix-chat-lvl'); if (cl) cl.textContent = c + '%';
  }
  const o = JSON.parse(el.dataset.cmd); o.value = v; send(o);
}

function banner() {
  const st = S.status; if (!st || !st.title) return '';
  const sev = st.severity;
  if (sev === 'success') return '';
  const icon = { info:'info', warning:'warning', error:'error', success:'success' }[sev];
  let btn = '';
  if (st.needsRepair) btn = `<button class="btn btn-primary" ${st.setupBusy?'disabled':''} title="${esc(T('Banner.Repair.Tip'))}" onclick="send({cmd:'repair'})">${ic('repair')} ${esc(T('Banner.Repair'))}</button>`;

  return `<div class="banner banner-${sev}"><div class="card-left"><span class="banner-icon-${sev}">${ic(icon,18)}</span><div><div class="card-title">${esc(st.title)}</div><div class="card-desc">${esc(st.message)}</div></div></div>${btn}</div>`;
}

function toggleCycle(v, on) {
  let list = S.knob.cycle.slice();
  if (on && !list.includes(v)) list.push(v);
  if (!on) list = list.filter(x => x !== v);
  const order = ['Mix', 'Volume', 'Game', 'Chat'];
  list.sort((a, b) => order.indexOf(a) - order.indexOf(b));
  send({cmd: 'setKnobCycle', value: list});
}

    body = `<h1 class="page-title">${esc(T('Wizard.S2.Title'))}</h1><p class="page-sub">${esc(T('Wizard.S2.Subtitle'))}</p>
      <div class="section-header">${esc(T('Wizard.S2.OutputLabel'))}</div>
      <select class="fluent-select" style="width:100%" onchange="V.wiz.output=this.value;this.blur()">${S.audio.outputs.map(o => `<option value="${esc(o.id)}" ${o.id===d.output?'selected':''}>${esc(o.label)}</option>`).join('')}</select>
      <div class="card-desc" style="margin-top:6px">${esc(T('Wizard.S2.OutputHint'))}</div>
      <div class="section-header">${esc(T('Wizard.S2.ModeLabel'))}</div>
      ${radio('PerApp', T('Wizard.S2.ModePerAppTitle'), T('Wizard.S2.ModePerAppDesc'))}
      ${radio('VirtualDevices', T('Wizard.S2.ModeVirtualTitle'), T('Wizard.S2.ModeVirtualDesc'))}
      <div class="card-desc" style="margin-top:8px">${esc(w.vbReady ? T('Wizard.S2.VbReady') : T('Wizard.S2.VbInstallNeeded'))}</div>`;
  } else {
    body = `<h1 class="page-title">${esc(T('Wizard.S3.Title'))}</h1><p class="page-sub">${esc(T('Wizard.S3.Subtitle'))}</p>
      ${card(`<div class="card-title">${esc(T('Wizard.S3.KnobBoxTitle'))}</div><div class="card-desc" style="margin-top:6px;line-height:1.7">${esc(T('Wizard.S3.KnobRule1'))}<br>${esc(T('Wizard.S3.KnobRule2'))}<br>${esc(T('Wizard.S3.KnobRule3'))}</div>`)}
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
        <label class="chk-row"><input type="checkbox" ${d.startWithWindows?'checked':''} onchange="V.wiz.startWithWindows=this.checked"> ${esc(T('Wizard.S3.StartWithWindows'))}</label>
        <label class="chk-row"><input type="checkbox" ${d.disableDucking?'checked':''} onchange="V.wiz.disableDucking=this.checked"> ${esc(T('Wizard.S3.DisableDucking'))}</label>
      </div>
      <div class="card-desc" style="margin-top:14px">${esc(T('Wizard.S3.DoneNote'))}</div>`;
  }
  return `<div class="wiz-shell" style="height:100vh"><div class="wiz-body"><div class="card-left" style="margin-bottom:10px"><img src="${ICON_URI}" width="28" height="28" alt=""><span class="wiz-step">${esc(T('Wizard.StepIndicator', step))}</span></div>${body}</div>
    <div class="wiz-footer"><button class="btn" onclick="wizBack()">${esc(step === 1 ? T('Wizard.Skip') : T('Wizard.Back'))}</button>
      <button class="btn btn-primary" onclick="wizNext()">${esc(step === 3 ? T('Wizard.Finish') : T('Wizard.Next'))}</button></div></div>`;
}
function wizBack() { if (V.step === 1) { send(Object.assign({cmd: 'wizardSkip'}, wizDraft())); } else { V.step--; render(true); } }
function wizNext() { if (V.step < 3) { V.step++; render(true); } else { send(Object.assign({cmd: 'wizardFinish'}, wizDraft())); } }

// ------------------------------------------------------------------------------------------ shell
const PAGES = [['mixer', 'Nav.Mixer', 'mixer'], ['apps', 'Nav.Apps', 'apps'], ['knob', 'Nav.Knob', 'knob'], ['audio', 'Nav.Audio', 'audio']];
function nav(p) { V.page = p; const sc = document.querySelector('.content-scroll'); render(true); const sc2 = document.querySelector('.content-scroll'); if (sc2) sc2.scrollTop = 0; if (p === 'apps') send({cmd: 'rescan'}); }
function shell(content) {
  const item = ([id, key, icon]) => `<button class="nav-item ${V.page===id?'active':''}" title="${esc(T(key + '.Tip'))}" onclick="nav('${id}')">${ic(icon,16)}<span class="nav-label">${esc(T(key))}</span></button>`;
  return `<div class="app-shell"><nav class="nav ${V.nav?'collapsed':''}"><div class="nav-top">
      <button class="nav-ham" onclick="V.nav=!V.nav;render(true)">${ic('ham',16)}</button>
      <div class="nav-group">${PAGES.map(item).join('')}</div></div>
      <div class="nav-group"><div class="nav-sep"></div>${item(['general', 'Nav.General', 'general'])}</div></nav>
    <main class="content-frame"><div class="content-scroll">${content}</div></main></div>`;
}

function render(force) {
  if (!S) return;
  if (interacting && !force) { pending = true; return; }
  pending = false;
  document.documentElement.dataset.theme = S.dark ? 'dark' : 'light';
  document.documentElement.lang = S.lang;
  const sc = document.querySelector('.content-scroll') || document.querySelector('.wiz-body');
  const top = sc ? sc.scrollTop : 0;
  const ae = document.activeElement, focusId = ae && ae.id, selStart = ae && ae.selectionStart;
  let html;
  if (KIND === 'wizard') html = pageWizard();
  else {
    const p = { mixer: pageMixer, apps: pageApps, knob: pageKnob, audio: pageAudio, general: pageGeneral }[V.page] || pageMixer;
    html = shell(p());
  }
  document.getElementById('root').innerHTML = html;
  const sc2 = document.querySelector('.content-scroll') || document.querySelector('.wiz-body');
  if (sc2) sc2.scrollTop = top;
  if (focusId) { const el = document.getElementById(focusId); if (el && el.tagName === 'INPUT' && el.type === 'text') { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  applyMeters();
}

// ------------------------------------------------------------------------------------------ live meters
const M = { game: 0, chat: 0, out: 0, apps: {} };
let live = null;
function smooth(cur, target) { return target > cur ? target : cur + (target - cur) * 0.18; }
function setMeter(el, v) { if (el) el.style.transform = `scaleX(${Math.max(0, Math.min(1, v))})`; }
function applyMeters() {
  setMeter(document.getElementById('meter-game'), M.game);
  setMeter(document.getElementById('meter-chat'), M.chat);
  setMeter(document.getElementById('meter-out'), M.out);
  document.querySelectorAll('[data-app]').forEach(el => setMeter(el, M.apps[el.dataset.app] || 0));
}
function onLive(l) {
  M.game = smooth(M.game, Math.sqrt(Math.min(1, l.gamePeak)));
  M.chat = smooth(M.chat, Math.sqrt(Math.min(1, l.chatPeak)));
  M.out = smooth(M.out, Math.sqrt(Math.min(1, l.outPeak)));
  const seen = {};
  for (const [k, p] of l.apps) { M.apps[k] = smooth(M.apps[k] || 0, Math.sqrt(Math.min(1, p))); seen[k] = 1; }
  for (const k in M.apps) if (!seen[k]) M.apps[k] = smooth(M.apps[k], 0);
  applyMeters();
  const chip = document.getElementById('chip'); if (chip && chip.textContent !== l.chip) chip.textContent = l.chip;
  const lk = document.getElementById('lastKey'); if (lk && l.lastKey && lk.textContent !== l.lastKey) lk.textContent = l.lastKey;
}

// ------------------------------------------------------------------------------------------ interaction guard
// While the user drags a slider (or a drop-down list is open) incoming state must not rebuild the page.
let interactKind = '', interactTimer = 0;
function startInteraction(kind, el) {
  interacting = true; interactKind = kind;
  clearTimeout(interactTimer);
  interactTimer = setTimeout(() => { if (interacting && interactKind === 'select') endInteraction(); }, 8000);
  if (kind === 'range' && el && el.setPointerCapture && window._lastPtrId != null) {
    try { el.setPointerCapture(window._lastPtrId); } catch {}
  }
}
function endInteraction() {
  clearTimeout(interactTimer); interactTimer = 0; interactKind = '';
  if (!interacting) return;
  interacting = false;
  if (pending) setTimeout(() => { if (!interacting) render(true); }, 0);
}
document.addEventListener('pointerdown', e => {
  window._lastPtrId = e.pointerId;
  const r = e.target.closest('input[type=range]');
  if (r) { startInteraction('range', r); return; }
  const s = e.target.closest('select');
  if (s) startInteraction('select', s);
}, true);
document.addEventListener('pointermove', e => {
  if (interacting && interactKind === 'range' && e.buttons === 0) endInteraction();
}, true);
document.addEventListener('pointerup', e => { if (interactKind !== 'select') endInteraction(); }, true);
document.addEventListener('pointercancel', () => endInteraction(), true);
document.addEventListener('lostpointercapture', () => { if (interactKind === 'range') endInteraction(); }, true);
document.addEventListener('change', e => { if (e.target.tagName === 'SELECT') endInteraction(); }, true);
document.addEventListener('focusout', e => { if (e.target.tagName === 'SELECT') endInteraction(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && interacting) endInteraction(); }, true);
window.addEventListener('blur', () => endInteraction());
document.addEventListener('dblclick', e => { if (e.target.id === 'mix') send({cmd: 'resetMix'}); });
document.addEventListener('keydown', e => {
  if (KIND !== 'main') return;
  if (e.ctrlKey && e.key >= '1' && e.key <= '5') { nav(['mixer', 'apps', 'knob', 'audio', 'general'][+e.key - 1]); e.preventDefault(); }
  if (e.key === 'Escape' && S && S.knob && /…|\.\.\./.test(S.knob.hotkeyText)) send({cmd: 'cancelCapture'});
});
document.addEventListener('contextmenu', e => e.preventDefault());

window.scrollToEnd = () => { const sc = document.querySelector('.content-scroll'); if (sc) sc.scrollTop = sc.scrollHeight; };
window.chrome.webview.addEventListener('message', e => {
  const m = e.data;
  if (!m || !m.t) return;
  if (m.t === 'state') { S = m; render(false); }
  else if (m.t === 'live') onLive(m);
  else if (m.t === 'nav') { V.page = m.page; render(true); }
  else if (m.t === 'wizardStep') { V.step = m.step; render(true); }
});
send({cmd: 'ready'});
</script>
</body>
</html>
