<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DualMix</title>
<style>
:root {
  color-scheme: dark;
  --bg: #202020;
  --shell-bg: rgba(32, 32, 32, 0.56);
  --frame-bg: rgba(40, 40, 40, 0.44);
  --frame-border: rgba(255, 255, 255, 0.065);
  --surface: rgba(255, 255, 255, 0.052);
  --surface-hover: rgba(255, 255, 255, 0.085);
  --surface-border: rgba(255, 255, 255, 0.08);
  --control-bg: rgba(255, 255, 255, 0.06);
  --control-border: rgba(255, 255, 255, 0.11);
  --subtle-bg: rgba(255, 255, 255, 0.065);
  --nav-active: rgba(255, 255, 255, 0.075);
  --text: #FFFFFF;
  --text2: rgba(255, 255, 255, 0.72);
  --text3: rgba(255, 255, 255, 0.48);
  --accent: #60CDFF;
  --accent-text: #000000;
  --accent-link: #60CDFF;
  --game: #FF9A52;
  --game-soft: rgba(255, 154, 82, 0.18);
  --chat: #5CC8FF;
  --chat-soft: rgba(92, 200, 255, 0.18);
  --meter-track: rgba(255, 255, 255, 0.13);
  --success: #6CCB5F;
  --success-bg: rgba(108, 203, 95, 0.13);
  --warn: #FCE100;
  --warn-bg: rgba(252, 225, 0, 0.12);
  --err: #FF99A4;
  --err-bg: rgba(255, 153, 164, 0.13);
  --info: #60CDFF;
  --info-bg: rgba(96, 205, 255, 0.12);
  --thumb-outer: #3B3B3B;
  --thumb-border: rgba(255, 255, 255, 0.16);
  --dropdown-bg: #2C2C2C;
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #F3F3F3;
  --shell-bg: rgba(243, 243, 243, 0.56);
  --frame-bg: rgba(255, 255, 255, 0.48);
  --frame-border: rgba(0, 0, 0, 0.06);
  --surface: rgba(255, 255, 255, 0.78);
  --surface-hover: rgba(255, 255, 255, 0.96);
  --surface-border: rgba(0, 0, 0, 0.068);
  --control-bg: rgba(255, 255, 255, 0.76);
  --control-border: rgba(0, 0, 0, 0.095);
  --subtle-bg: rgba(0, 0, 0, 0.045);
  --nav-active: rgba(0, 0, 0, 0.05);
  --text: #1A1A1A;
  --text2: rgba(0, 0, 0, 0.62);
  --text3: rgba(0, 0, 0, 0.44);
  --accent: #005FB8;
  --accent-text: #FFFFFF;
  --accent-link: #005FB8;
  --game: #C24E00;
  --game-soft: rgba(194, 78, 0, 0.14);
  --chat: #0067C0;
  --chat-soft: rgba(0, 103, 192, 0.14);
  --meter-track: rgba(0, 0, 0, 0.13);
  --success: #0F7B0F;
  --success-bg: rgba(15, 123, 15, 0.10);
  --warn: #9D5D00;
  --warn-bg: rgba(255, 244, 206, 0.85);
  --err: #C42B1C;
  --err-bg: rgba(253, 231, 233, 0.86);
  --info: #005FB8;
  --info-bg: rgba(0, 95, 184, 0.09);
  --thumb-outer: #FFFFFF;
  --thumb-border: rgba(0, 0, 0, 0.18);
  --dropdown-bg: #FFFFFF;
}
html.snapshot-opaque {
  --shell-bg: var(--bg);
}
html.snapshot-opaque[data-theme="light"] {
  --frame-bg: #F9F9F9;
}
html.snapshot-opaque[data-theme="dark"] {
  --frame-bg: #272727;
}
* { box-sizing: border-box; user-select: none; }
html, body {
  margin: 0; padding: 0; height: 100%; width: 100%;
  background: var(--shell-bg); color: var(--text);
  font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 14px; line-height: 1.4; overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.mono { font-family: 'Cascadia Mono', Consolas, monospace; font-size: 12px; }
svg { display: block; flex-shrink: 0; }
.hidden { display: none !important; }

/* Integrated Fluent 2 TitleBar */
.titlebar {
  height: 36px; width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding-left: 14px; flex-shrink: 0; -webkit-app-region: drag;
}
.tb-left { display: flex; align-items: center; gap: 10px; pointer-events: none; }
.tb-title { font-size: 12px; font-weight: 400; color: var(--text); letter-spacing: 0.01em; }
.tb-actions { display: flex; height: 34px; align-items: stretch; -webkit-app-region: no-drag; }
.tb-btn {
  width: 46px; height: 34px; border: none; background: transparent; color: var(--text);
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: background 0.1s, color 0.1s; padding: 0;
}
.tb-btn:hover { background: var(--subtle-bg); }
.tb-close:hover { background: #C42B1C; color: #FFFFFF; }

/* Main shell + NavigationView */
.root-col { display: flex; flex-direction: column; height: 100vh; width: 100vw; }
.app-shell { display: flex; flex: 1; min-height: 0; width: 100%; }
.nav {
  width: 218px; flex-shrink: 0; padding: 2px 6px 10px 6px;
  display: flex; flex-direction: column; justify-content: space-between;
  background: transparent; transition: width 0.14s ease;
}
.nav.collapsed { width: 52px; }
.nav-top { display: flex; flex-direction: column; gap: 2px; }
.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-ham {
  width: 40px; height: 34px; border-radius: 5px; border: none; background: transparent;
  color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center;
  margin-bottom: 4px; transition: background 0.12s;
}
.nav-ham:hover { background: var(--subtle-bg); }
.nav-item {
  display: flex; align-items: center; gap: 12px; height: 36px;
  padding: 0 11px; border-radius: 5px; border: none;
  background: transparent; color: var(--text); cursor: pointer;
  font-size: 13.5px; text-align: left; position: relative; white-space: nowrap; overflow: hidden;
  font-family: inherit; transition: background 0.12s;
}
.nav-item:hover { background: var(--subtle-bg); }
.nav-item.active { background: var(--nav-active); font-weight: 500; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 9px; bottom: 9px;
  width: 3px; border-radius: 2px; background: var(--accent);
}
.nav.collapsed .nav-item { padding: 0; justify-content: center; }
.nav.collapsed .nav-label { display: none; }
.nav-sep { height: 1px; background: var(--surface-border); margin: 4px 6px 6px 6px; }

.content-frame {
  flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--frame-bg);
  border-top: 1px solid var(--frame-border);
  border-left: 1px solid var(--frame-border);
  border-top-left-radius: 8px;
}
.content-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  padding: 14px 34px 18px 34px;
}
.page { max-width: 980px; margin: 0 auto; }
.page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 10px; }
.page-title { font-size: 28px; font-weight: 600; margin: 0; line-height: 1.2; letter-spacing: -0.01em; }
.page-sub { font-size: 13.5px; color: var(--text2); margin: 3px 0 0 0; }
.section-header { font-size: 14px; font-weight: 600; margin: 12px 0 6px 0; color: var(--text); }

/* Cards & surfaces */
.card {
  background: var(--surface); border: 1px solid var(--surface-border);
  border-radius: 8px; padding: 12px 18px; margin-bottom: 4px;
}
.card-hero { padding: 14px 20px; }
.card-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.card-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
.card-title { font-size: 14px; font-weight: 500; color: var(--text); }
.card-desc { font-size: 12px; color: var(--text2); margin-top: 2px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }

/* Chip & badge */
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 12px; border-radius: 14px;
  background: var(--control-bg); border: 1px solid var(--control-border);
  font-size: 12px; color: var(--text2); white-space: nowrap; margin-top: 2px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot-success { background: var(--success); }
.dot-warning { background: var(--warn); }
.dot-error { background: var(--err); }
.dot-info { background: var(--info); }

.badge {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.badge-sm { width: 32px; height: 32px; }
.badge-game { background: var(--game-soft); color: var(--game); }
.badge-chat { background: var(--chat-soft); color: var(--chat); }
.badge-neutral { background: var(--subtle-bg); color: var(--text); }

/* Status banner */
.banner {
  border-radius: 8px; padding: 11px 15px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--surface-border);
}
.banner-success { background: var(--success-bg); }
.banner-warning { background: var(--warn-bg); }
.banner-error { background: var(--err-bg); }
.banner-info { background: var(--info-bg); }
.banner-icon-success { color: var(--success); }
.banner-icon-warning { color: var(--warn); }
.banner-icon-error { color: var(--err); }
.banner-icon-info { color: var(--info); }

/* Buttons & inputs */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 31px; padding: 0 13px; border-radius: 5px;
  border: 1px solid var(--control-border); border-bottom-color: rgba(0, 0, 0, 0.16);
  background: var(--control-bg); color: var(--text); font-family: inherit;
  font-size: 13px; font-weight: 400; cursor: pointer; transition: background 0.1s; white-space: nowrap;
}
html:not([data-theme="light"]) .btn { border-bottom-color: rgba(255, 255, 255, 0.14); }
.btn:hover:not(:disabled) { background: var(--surface-hover); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-text); border-color: transparent; font-weight: 600; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.06); background: var(--accent); }
.btn-subtle { background: transparent; border-color: transparent; }
.btn-subtle:hover:not(:disabled) { background: var(--subtle-bg); }
.btn-icon { width: 34px; height: 34px; padding: 0; }
.btn-icon.muted { color: var(--err); }

select.fluent-select, input.fluent-input {
  height: 32px; padding: 0 10px; border-radius: 5px;
  border: 1px solid var(--control-border); background: var(--dropdown-bg);
  color: var(--text); font-family: inherit; font-size: 13px; outline: none;
}
select.fluent-select option { background: var(--dropdown-bg); color: var(--text); }
input.fluent-input { width: 100%; padding-left: 32px; }
input.fluent-input:focus, select.fluent-select:focus { border-color: var(--accent); }

/* Toggle switch */
.switch { position: relative; display: inline-flex; align-items: center; cursor: pointer; flex-shrink: 0; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch-track {
  width: 40px; height: 20px; border-radius: 10px;
  background: transparent; border: 1.5px solid var(--text2);
  position: relative; transition: all 0.15s;
}
.switch-track::after {
  content: ''; position: absolute; left: 3px; top: 2.5px;
  width: 12px; height: 12px; border-radius: 50%;
  background: var(--text2); transition: all 0.15s;
}
.switch input:checked + .switch-track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .switch-track::after { transform: translateX(19px); background: var(--accent-text); }
.switch input:disabled + .switch-track { opacity: 0.4; cursor: default; }

/* Segmented control */
.segment {
  display: inline-flex; align-items: center; padding: 2px; border-radius: 6px;
  background: var(--control-bg); border: 1px solid var(--control-border);
}
.seg-btn {
  min-width: 64px; height: 28px; padding: 0 12px; border-radius: 4px;
  border: none; background: transparent; color: var(--text);
  font-family: inherit; font-size: 13px; cursor: pointer; white-space: nowrap;
}
.seg-btn:hover { background: var(--subtle-bg); }
.seg-btn.active { background: var(--accent); color: var(--accent-text); font-weight: 600; }

/* Fluent 2 Sliders with accent progress fill + concentric WPF-UI thumb */
.slider-wrap { display: flex; align-items: center; gap: 10px; width: 100%; }
input[type="range"].fluent-range {
  -webkit-appearance: none; appearance: none; width: 100%; height: 24px;
  background: transparent; cursor: pointer; margin: 0; outline: none;
}
input[type="range"].fluent-range::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: linear-gradient(
    to right,
    var(--accent) 0%,
    var(--accent) var(--pct, 50%),
    var(--meter-track) var(--pct, 50%),
    var(--meter-track) 100%
  );
}
input[type="range"].fluent-range:disabled::-webkit-slider-runnable-track {
  background: var(--meter-track);
}
input[type="range"].fluent-range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 18px; height: 18px; border-radius: 50%; margin-top: -7px;
  background: var(--accent); border: 1px solid var(--thumb-border);
  box-shadow: inset 0 0 0 4px var(--thumb-outer), 0 1px 3px rgba(0, 0, 0, 0.22);
  transition: box-shadow 0.1s;
}
input[type="range"].fluent-range:hover:not(:disabled)::-webkit-slider-thumb {
  box-shadow: inset 0 0 0 3px var(--thumb-outer), 0 1px 4px rgba(0, 0, 0, 0.28);
}

/* ChatMix Balance Slider (matches WPF-UI Theme.xaml BalanceThumb 22px + 6px track) */
.balance-box { position: relative; flex: 1; height: 32px; display: flex; align-items: center; margin: 0 14px; }
.balance-track {
  position: absolute; left: 10px; right: 10px; height: 6px; border-radius: 3px;
  background: linear-gradient(90deg, #E88338 0%, rgba(138, 138, 138, 0.34) 50%, #3E9FFF 100%);
  pointer-events: none;
}
.balance-center {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 2px; height: 14px; border-radius: 1px; background: var(--text3); pointer-events: none; opacity: 0.7;
}
input[type="range"].balance-range { position: relative; z-index: 2; }
input[type="range"].balance-range::-webkit-slider-runnable-track { background: transparent !important; height: 6px; }
input[type="range"].balance-range::-webkit-slider-thumb {
  width: 22px; height: 22px; margin-top: -8px;
  background: var(--accent); border: 1px solid var(--thumb-border);
  box-shadow: inset 0 0 0 4.5px var(--thumb-outer), 0 1px 4px rgba(0, 0, 0, 0.28);
}
input[type="range"].balance-range:hover::-webkit-slider-thumb {
  box-shadow: inset 0 0 0 3.5px var(--thumb-outer), 0 2px 6px rgba(0, 0, 0, 0.32);
}

/* Peak meter */
.meter-track {
  height: 3.5px; border-radius: 2px; background: var(--meter-track); overflow: hidden; margin-top: 8px;
}
.meter-fill {
  height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0);
  transition: transform 0.04s linear;
}
.meter-game { background: var(--game); }
.meter-chat { background: var(--chat); }
.meter-accent { background: var(--accent); }

/* Expander */
.expander-head { cursor: pointer; }
.expander-body { margin-top: 12px; padding-left: 14px; border-top: 1px solid var(--surface-border); padding-top: 12px; }

/* Checkboxes */
.chk-row { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; }
.chk-row input[type="checkbox"], .radio-card input[type="radio"] { accent-color: var(--accent); width: 16px; height: 16px; cursor: pointer; }

/* Apps rows */
.apps-toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.search-wrap { position: relative; width: 320px; }
.search-icon { position: absolute; left: 10px; top: 8px; color: var(--text2); pointer-events: none; }
.app-row { display: grid; grid-template-columns: 32px 1fr auto auto 176px; align-items: center; gap: 12px; padding: 10px 16px; }
.app-row.inactive { opacity: 0.6; }
.app-avatar {
  width: 32px; height: 32px; border-radius: 6px; background: var(--subtle-bg);
  display: flex; align-items: center; justify-content: center; font-weight: 600; color: var(--text2);
}

/* Wizard */
.wiz-shell { display: flex; flex-direction: column; flex: 1; min-height: 0; width: 100%; }
.wiz-body { flex: 1; overflow-y: auto; padding: 14px 32px 16px 32px; }
.wiz-footer {
  border-top: 1px solid var(--surface-border); padding: 14px 24px;
  display: flex; align-items: center; justify-content: space-between;
}
.radio-card { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; }
.knob-box {
  display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin-top: 14px; font-size: 13px;
}
.link { color: var(--accent-link); text-decoration: none; cursor: pointer; }
.link:hover { text-decoration: underline; }
</style>

<body>
<div id="root"></div>
<script>
const LOC_TABLE = __LOC_JSON__;
const APP_ICON_URI = "__ICON_URI__";

let S = null;
let dragLocks = {};
let appsFilter = "";
let showInactive = false;
let expandCycle = false;
let expandKeys = false;
let expandSignal = true;
let navCollapsed = false;
let isMaximized = false;
let meters = { game: 0, chat: 0, out: 0 };

function setRangePct(el) {
  if (!el) return;
  const min = Number(el.min || 0);
  const max = Number(el.max || 100);
  const val = Number(el.value || 0);
  const pct = max > min ? ((val - min) * 100 / (max - min)) : 0;
  el.style.setProperty('--pct', Math.max(0, Math.min(100, pct)) + '%');
}

function clearDragLocks() {
  if (Object.keys(dragLocks).length > 0) dragLocks = {};
}
window.addEventListener('pointerup', clearDragLocks);
window.addEventListener('pointercancel', clearDragLocks);
window.addEventListener('blur', clearDragLocks);

function post(obj) {
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(JSON.stringify(obj));
  }
}

function T(key, ...args) {
  const pair = LOC_TABLE[key];
  let tpl = pair ? (S && S.lang === 'it' ? pair[1] : pair[0]) : key;
  for (let i = 0; i < args.length; i++) {
    tpl = tpl.replace(new RegExp('\\{' + i + '(?::[^}]*)?\\}', 'g'), String(args[i]));
  }
  return tpl;
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function shortDev(name) {
  const i = (name || '').indexOf(' (');
  return i > 0 ? name.slice(0, i) : (name || '—');
}

    settings: '<circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',

    search: '<circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',

function toggleSwitch(checked, onchangeJs) {
  return `<label class="switch"><input type="checkbox" ${checked?'checked':''} onchange="${onchangeJs}"><span class="switch-track"></span></label>`;
}

function knobDescribe() {
  let l, r, p, n;
  if (S.knobTarget === 'Mix') {
    l = T('Knob.Describe.MixL'); r = T('Knob.Describe.MixR');
    p = S.knobMixPressMutes ? T('Knob.Describe.MixPressMute') : T('Knob.Describe.MixPressReset');
    n = T('Knob.Describe.MixNote');
  } else if (S.knobTarget === 'Volume') {
    l = T('Knob.Describe.VolL'); r = T('Knob.Describe.VolR');
    p = T('Knob.Describe.VolPress'); n = T('Knob.Describe.VolNote');
    return { l, r, p, n };
  } else if (S.knobTarget === 'Game') {
    l = T('Knob.Describe.GameL'); r = T('Knob.Describe.GameR');
    p = T('Knob.Describe.GamePress'); n = T('Knob.Describe.MixNote');
  } else {
    l = T('Knob.Describe.ChatL'); r = T('Knob.Describe.ChatR');
    p = T('Knob.Describe.ChatPress'); n = T('Knob.Describe.MixNote');
  }
  if (S.knobInvert) [l, r] = [r, l];
  return { l, r, p, n };
}

function sendKnobOpts(patch) {
  const o = {
    cmd: 'setKnobOptions',
    double_press: S.knobDoublePress,
    ctrl_press: S.knobCtrlPress,
    ctrl_alt: S.knobCtrlAlt,
    enabled: S.knobEnabled,
    invert: S.knobInvert,
    mix_press_mutes: S.knobMixPressMutes,
    ...patch
  };
  post(o);
}

function toggleCycleTarget(t, checked) {
  let c = [...S.knobCycle];
  if (checked && !c.includes(t)) c.push(t);
  if (!checked) c = c.filter(x => x !== t);
  if (c.length === 0) { render(); return; }
  post({ cmd: 'setKnobCycle', cycle: c });
}

let wizDraft = null;

function renderWizard() {

      outputId: S.selectedOutputId || '',
      mode: S.engineMode,
      startWithWindows: S.autostart,
      disableDucking: true,
    };
  }
  const step = S.wizardStep || 1;
  let body = '';
  if (step === 1) {
    body = `

        </div>
      </div>`;
  } else if (step === 2) {
    body = `
      <div style="font-size:22px;font-weight:600;margin-bottom:4px">${esc(T('Wizard.S2.Title'))}</div>
      <div class="card-desc" style="font-size:13px;margin-bottom:16px">${esc(T('Wizard.S2.Subtitle'))}</div>
      <div class="card" style="margin-bottom:12px">
        <div class="card-title" style="font-weight:600;margin-bottom:8px">${esc(T('Wizard.S2.OutputLabel'))}</div>
        <select class="fluent-select" style="width:100%;margin-bottom:6px" onchange="wizDraft.outputId=this.value">
          ${(S.outputChoices || []).map(c => `<option value="${esc(c.id || '')}" ${wizDraft.outputId===(c.id||'')?'selected':''}>${esc(c.label)}</option>`).join('')}
        </select>
        <div class="card-desc">${esc(T('Wizard.S2.OutputHint'))}</div>
      </div>
      <div class="section-header" style="margin-top:8px">${esc(T('Wizard.S2.ModeLabel'))}</div>
      <div class="card" style="margin-bottom:8px">
        <label class="radio-card">
          <input type="radio" name="wizmode" ${wizDraft.mode==='PerApp'?'checked':''} onchange="wizDraft.mode='PerApp'">
          <div>
            <div class="card-title" style="font-weight:600">${esc(T('Wizard.S2.ModePerAppTitle'))}</div>
            <div class="card-desc">${esc(T('Wizard.S2.ModePerAppDesc'))}</div>
          </div>
        </label>
      </div>
      <div class="card">
        <label class="radio-card">
          <input type="radio" name="wizmode" ${wizDraft.mode==='VirtualDevices'?'checked':''} onchange="wizDraft.mode='VirtualDevices'">
          <div>
            <div class="card-title" style="font-weight:600">${esc(T('Wizard.S2.ModeVirtualTitle'))}</div>
            <div class="card-desc">${esc(T('Wizard.S2.ModeVirtualDesc'))}</div>
            <div class="card-desc" style="margin-top:6px;font-weight:600;color:var(--accent)">${esc(S.vbCablesPresent ? T('Wizard.S2.VbReady') : T('Wizard.S2.VbInstallNeeded'))}</div>
          </div>
        </label>
      </div>`;
  } else {
    body = `
      <div style="font-size:22px;font-weight:600;margin-bottom:4px">${esc(T('Wizard.S3.Title'))}</div>
      <div class="card-desc" style="font-size:13px;margin-bottom:16px">${esc(T('Wizard.S3.Subtitle'))}</div>
      <div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          ${svg('keyboard', 18)}
          <span class="card-title" style="font-weight:600">${esc(T('Wizard.S3.KnobBoxTitle'))}</span>
        </div>
        <div class="card-desc" style="font-size:13px;margin-bottom:4px">${esc(T('Wizard.S3.KnobRule1'))}</div>
        <div class="card-desc" style="font-size:13px;margin-bottom:4px">${esc(T('Wizard.S3.KnobRule2'))}</div>
        <div class="card-desc" style="font-size:13px">${esc(T('Wizard.S3.KnobRule3'))}</div>
      </div>
      <div class="card" style="margin-bottom:10px">
        <label class="chk-row" style="margin-bottom:10px;display:flex">

      <div class="card-desc">${esc(T('Wizard.S3.DoneNote'))}</div>`;

  const nextLbl = step === 3 ? T('Wizard.Finish') : T('Wizard.Next');
  const finish = (skip) => post({
    cmd: 'wizardFinish',
    skip_driver: skip,
    output_id: wizDraft.outputId || null,
    mode: wizDraft.mode,
    start_with_windows: wizDraft.startWithWindows,
    disable_ducking: wizDraft.disableDucking,
  });
  window._wizBack = () => step === 1 ? finish(true) : post({ cmd: 'setWizardStep', step: step - 1 });

      <div class="wiz-body">${body}</div>
      <div class="wiz-footer">
        <span class="card-desc" style="font-size:13px">${esc(T('Wizard.StepIndicator', step))}</span>
        <div style="display:flex;gap:8px">
          <button class="btn" style="min-width:96px" onclick="_wizBack()">${esc(backLbl)}</button>
          <button class="btn btn-primary" style="min-width:128px" onclick="_wizNext()">${esc(nextLbl)}</button>
        </div>
      </div>
    </div>
  </div>`;
}

function render() {
  if (!S) return;
  document.documentElement.setAttribute('data-theme', S.dark ? 'dark' : 'light');
  if (S.mode === 'wizard') {
    renderWizard();
    return;
  }
  const tabs = [
    [0, 'Nav.Mixer', 'Nav.Mixer.Tip', 'options'],
    [1, 'Nav.Apps', 'Nav.Apps.Tip', 'apps'],
    [2, 'Nav.Knob', 'Nav.Knob.Tip', 'keyboard'],
    [3, 'Nav.Audio', 'Nav.Audio.Tip', 'speaker'],
  ];
  const pages = [renderMixer, renderApps, renderKnob, renderAudio, renderGeneral];
  const pageHtml = (pages[S.activeTab] || renderMixer)();

  const scrollEl = document.querySelector('.content-scroll');
  const prevScroll = scrollEl ? scrollEl.scrollTop : 0;
  const focusId = document.activeElement ? document.activeElement.id : null;

  document.getElementById('root').innerHTML = `<div class="root-col">
    ${renderTitleBar('DualMix', true)}
    <div class="app-shell">
      <aside class="nav ${navCollapsed?'collapsed':''}">
        <div class="nav-top">
          <button class="nav-ham" onclick="navCollapsed=!navCollapsed;render()" title="Navigation">${svg('hamburger', 16)}</button>
          <div class="nav-group">
            ${tabs.map(([i, k, tip, ic]) => `<button class="nav-item ${S.activeTab===i?'active':''}" title="${esc(T(tip))}" onclick="post({cmd:'setTab',tab:${i}})">${svg(ic,18)}<span class="nav-label">${esc(T(k))}</span></button>`).join('')}
          </div>
        </div>
        <div class="nav-group">
          <div class="nav-sep"></div>
          <button class="nav-item ${S.activeTab===4?'active':''}" title="${esc(T('Nav.General.Tip'))}" onclick="post({cmd:'setTab',tab:4})">${svg('settings',18)}<span class="nav-label">${esc(T('Nav.General'))}</span></button>
        </div>
      </aside>
      <div class="content-frame">
        <main class="content-scroll">${pageHtml}</main>
      </div>
    </div>
  </div>`;

  const newScroll = document.querySelector('.content-scroll');
  if (newScroll) newScroll.scrollTop = prevScroll;
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el && el.tagName === 'INPUT' && el.type === 'text') {
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }
  }
}

function updateLive(patch) {
  if (!S) return;
  Object.assign(S, patch);
  const smooth = (c, t) => t > c ? t : c + (t - c) * 0.18;
  meters.game = smooth(meters.game, Math.sqrt(Math.min(1, S.gamePeak || 0)));
  meters.chat = smooth(meters.chat, Math.sqrt(Math.min(1, S.chatPeak || 0)));
  meters.out = smooth(meters.out, Math.sqrt(Math.min(1, S.outputPeak || 0)));

  if (S.mode === 'main' && S.activeTab === 0) {
    const mg = document.getElementById('mt-game'); if (mg) mg.style.transform = `scaleX(${meters.game})`;
    const mc = document.getElementById('mt-chat'); if (mc) mc.style.transform = `scaleX(${meters.chat})`;
    const mo = document.getElementById('mt-out'); if (mo) mo.style.transform = `scaleX(${meters.out})`;
    const setT = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = v; };
    setT('mx-text', S.mixText); setT('mx-gval', S.gameLevelText); setT('mx-cval', S.chatLevelText);
    setT('mx-chip', S.engineChip); setT('mx-fmt', S.formatText);
    if (!dragLocks.mix) { const s = document.getElementById('sl-mix'); if (s) s.value = S.mixPercent; }
    if (!dragLocks.gvol) { const s = document.getElementById('sl-gvol'); if (s) { s.value = S.gameVolumePercent; setRangePct(s); } setT('tx-gvol', S.gameVolumePercent + '%'); }
    if (!dragLocks.cvol) { const s = document.getElementById('sl-cvol'); if (s) { s.value = S.chatVolumePercent; setRangePct(s); } setT('tx-cvol', S.chatVolumePercent + '%'); }
    if (!dragLocks.ovol) { const s = document.getElementById('sl-ovol'); if (s) { s.value = S.outputVolumePercent; setRangePct(s); } setT('tx-ovol', S.outputVolumePercent + '%'); }
  } else if (S.mode === 'main' && S.activeTab === 1 && !Object.keys(dragLocks).length) {
    for (const a of (S.apps || [])) {
      const el = document.querySelector(`[data-peak="${CSS.escape(a.key)}"]`);
      if (el) el.style.transform = `scaleX(${Math.sqrt(Math.min(1, a.peak || 0))})`;
    }
  }
}

window.__dualmixSetMaximized = function(max) {
  if (isMaximized !== !!max) {
    isMaximized = !!max;
    if (S && S.mode === 'main') render();
  }
};

window.__dualmixSetState = function(next) {
  const prevTab = S ? S.activeTab : -1;
  const prevMode = S ? S.mode : '';
  S = next;
  if (S.mode === 'wizard' && prevMode !== 'wizard') wizDraft = null;
  if (Object.keys(dragLocks).length === 0 || prevTab !== S.activeTab || prevMode !== S.mode) {
    render();
  }
};
window.__dualmixLive = updateLive;
window.__dualmixScrollEnd = function() {
  const sc = document.querySelector('.content-scroll');
  if (!sc || sc.scrollHeight <= sc.clientHeight + 2) return false;
  sc.scrollTop = sc.scrollHeight;
  return true;
};

document.addEventListener('keydown', (e) => {
  if (!S || S.mode !== 'main') return;
  if (e.ctrlKey && !e.altKey && !e.shiftKey && e.key >= '1' && e.key <= '5') {
    e.preventDefault();
    post({ cmd: 'setTab', tab: Number(e.key) - 1 });
  } else if (e.key === 'Escape' && document.activeElement?.tagName !== 'INPUT') {
    e.preventDefault();
    post({ cmd: 'hideWindow' });
  }
});

post({ cmd: 'ready' });
</script>
</body>
</html>
